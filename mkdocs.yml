site_name: gServer GĐ3 — Tài liệu dự án
site_description: Tài liệu nền tảng (MapLibre/Mapbox, ASP.NET Boilerplate) và kiến trúc hệ thống GĐ3
theme:
  name: material
  language: vi
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Chuyển sang giao diện tối
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Chuyển sang giao diện sáng
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - toc.integrate

nav:
  - Tổng quan: index.md
  - Bản đồ (MapLibre/Mapbox):
      - MapLibre / Mapbox là gì?: maplibre/gioi-thieu.md
      - Cần học & cần quan tâm gì?: maplibre/lo-trinh-hoc.md
  - ASP.NET Boilerplate:
      - ASP.NET Boilerplate là gì?: abp/gioi-thieu.md
      - Cần học & cần biết gì?: abp/lo-trinh-hoc.md
  - Web GIS:
      - Kế hoạch hoàn thiện: web-gis/ke-hoach-hoan-thien.md
  - Kiến trúc hệ thống:
      - "Slide: Kiến trúc GĐ3 vs GĐ2": architecture/slide-kien-truc-hieu-nang.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
